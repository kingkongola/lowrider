# Täckningsmatris för systemet: funktioner som går över flera komponenter.
# Samma statuskoder som komponenter.yaml: A, S, F, N, X, SAKNAS.
kolumner:
  krav: Krav formulerat
  konstruktion: Konstruktion finns
  auto: Automatisk kontroll
  berakning: Simulering eller beräkning
  bank: Bänkprov
  maskin: Prov på maskinen
  felfall: Vad händer när det går fel
  agare: Ägande fil
  aterstallning: Återställning efter fel

funktioner:
  Tornets infästning på maskinen:
    krav: S MONTAGE.md (inget i Core ändras)
    konstruktion: S två M5, kanal för den nedre
    auto: A kontroll_montage.py, kontroll_omgivning.py
    berakning: A berakning_sidotorn.py (klämtryck under krypgränsen)
    bank: X kan bara provas på maskinen
    maskin: F 5.2-5.3
    felfall: S blå gänglåsning och märkfärg; F 6.11 uppstartsrutin
    agare: S MONTAGE.md
    aterstallning: S dra om M5 till 0,7 Nm, ny märkfärg; F 5.3 rörelseprov igen
  Armens rörelse och ändlägen:
    krav: S D020
    konstruktion: S hårda stopp, magnet, servo utan puls i vila
    auto: A kontroll_omgivning.py, probstyrning.yml (makronas självtest)
    berakning: A berakning_sidotorn.py (stopp och magnet)
    bank: F 1.2, 4.8-4.9
    maskin: F 6.2
    felfall: S armspärren stoppar jobb om armen inte syns parkerad; N magneten släpper under fräsning upptäcks inte förrän nästa jobb
    agare: S machine/probstyrning/README.md
    aterstallning: S arm_in.nc; stoppdel byts vid skada; ändlägen ställs om enligt probstyrning README
  Probmätning till nollpunkt:
    krav: S beslut 0036, probstyrning README (skillnadsmätning)
    konstruktion: S mat_z-makro, G38 på gpio.36
    auto: A makron.py självtest; cnc tester för probval
    berakning: N stiftets XY-läge ur CAD
    bank: F 1.3
    maskin: F 7.1-7.2
    felfall: S G38 utan kontakt ger larm; S okänt armläge nekar mätning
    agare: S machine/probstyrning/README.md
    aterstallning: S crtouch_larm_av.nc, sedan självtest och ny mätning
  Kamerabild och kalibrering:
    krav: S KAMERA_ANHALL.md
    konstruktion: S rakt ned, lins 130 mm
    auto: A cnc tester (kameraseende, kalibrering)
    berakning: S synfält 66 x 41 grader, ca 0,056 mm/px
    bank: F 1.6
    maskin: F 7.3
    felfall: S suddig eller mörk bild ger fel i sensorpi och armspärren
    agare: S machine/KAMERA_ANHALL.md
    aterstallning: S rengör linsen; kalibrering görs om om kameran lossats
  Belysning:
    krav: S D022
    konstruktion: S COB-fäste
    auto: A led-tre-vinklar.yml
    berakning: N säljaruppgifter
    bank: F värmeprov
    maskin: F 6.6
    felfall: N lyser efter stopp eftersom den matas från övervakningen
    agare: S machine/delar/led/README.md
    aterstallning: N byt LED-segment
  Armspärren:
    krav: S beslut 0035 och 0036
    konstruktion: S fast märke och mönster på armen
    auto: A cnc test_armsparr.py
    berakning: F 6.5 märkets plats väljs ur första bilden
    bank: X kan bara provas på maskinen
    maskin: F 6.5
    felfall: S oklar bild ger okänt läge och stopp
    agare: S cnc docs/beslut/0036
    aterstallning: S ny inlärning (cnc armsparr lar) efter ändring av märke eller kamera
  Vibrationsmätning:
    krav: S cnc verktygsovervakning.md
    konstruktion: S ADXL på styv platta, SPI
    auto: A cnc test_sensorpi.py (låtsas-SPI)
    berakning: S 3200 prov/s räcker till skärtonen; F 6.7 knackprov
    bank: F 1.7
    maskin: F 8.1
    felfall: S full FIFO redovisas som möjlig lucka
    agare: S cnc pi/README.md
    aterstallning: S sensorpi startar om sig själv
  Ljudmätning:
    krav: S cnc verktygsovervakning.md
    konstruktion: S INMP441 i panelen
    auto: A kontroll_mikrofon.py; cnc test_sensorpi.py
    berakning: N
    bank: F 1.8
    maskin: F 8.1
    felfall: S ingen inspelning ger fel i sensorpi
    agare: S cnc pi/README.md
    aterstallning: S sensorpi startar om sig själv
  Matning, övervakning:
    krav: S D023
    konstruktion: S HDR nr 2, LM2596 A
    auto: X går inte att kontrollera automatiskt; prövas fysiskt
    berakning: A berakning_sidotorn.py; S spänningsfall i EL_BELYSNING_OCH_STOPP.md
    bank: F 1.1, provkörning steg 1
    maskin: F 6.4
    felfall: S säkring F1 T2A och F2 T1A
    agare: S machine/EL_BELYSNING_OCH_STOPP.md
    aterstallning: S byt säkring F1/F2 efter orsak funnen
  Matning, maskin och servo:
    krav: S D023, D024
    konstruktion: S HDR nr 1, LM2596 B, kondensator
    auto: X går inte att kontrollera automatiskt; prövas fysiskt
    berakning: A berakning_sidotorn.py
    bank: F 1.1
    maskin: F 6.2
    felfall: N servot utan matning släpper; magneten håller
    agare: S KOPPLING_CORE_V0.md
    aterstallning: N
  Jord och störningar:
    krav: S en jordpunkt i tornet, skärm jordad i en ände
    konstruktion: S kopplingskortet, LiYCY
    auto: X går inte att kontrollera automatiskt; prövas fysiskt
    berakning: X störningar räknas inte fram tillförlitligt; de mäts med KATSU igång (6.8)
    bank: X kan bara provas på maskinen
    maskin: F 6.8 störningsprov med KATSU igång
    felfall: S mat_z mäter två gånger; falsk kontakt i första sökningen ger larm i den andra
    agare: S KOPPLING_CORE_V0.md
    aterstallning: S mät om med mat_z; repeterbarhetsprov 7.2
  Stoppkedjan:
    krav: S D024
    konstruktion: S laddningspump, kontaktor, nödstopp, larmslinga
    auto: A cnc test_sensorpi.py (stoppvakten)
    berakning: S pumpens värden räknade
    bank: F stopplådans bänkprov på 24 V
    maskin: F provkörning steg 10
    felfall: S Pi-krasch, fast utgång och kabelbrott släpper kontaktorn
    agare: S machine/EL_BELYSNING_OCH_STOPP.md
    aterstallning: S grön knapp efter åtgärdad orsak; $X i FluidNC för larmet
  Start efter stopp:
    krav: S D024 (bara grön knapp)
    konstruktion: S stoppvakten
    auto: A cnc test_sensorpi.py
    berakning: X ingen beräkning behövs; beteendet är binärt
    bank: F stopplådans bänkprov
    maskin: F provkörning steg 10
    felfall: S fasthållen knapp startar inte om
    agare: S cnc pi/sensorpi.py
    aterstallning: S grön knapp; knappen måste släppas och tryckas igen
  FluidNC-konfiguration:
    krav: S D021, D024
    konstruktion: S konfigförslaget (sex rader); estop_pin ej inlagd
    auto: A probstyrning.yml
    berakning: X ingen beräkning behövs; beteendet är binärt
    bank: X kan bara provas på maskinen
    maskin: A konfig.py --med-stopp; F 6.1
    felfall: N fel polaritet på probe.pin avvisas av check_mode_start
    agare: S machine/probstyrning/README.md
    aterstallning: S återställ sparad config.yaml ur machine/ (machine/AKTIV)
  Programvara på Pi:n:
    krav: S cnc pi/README.md
    konstruktion: S sensorpi.py med systemd
    auto: A cnc test_sensorpi.py (16 tester)
    berakning: X ingen beräkning behövs; beteendet är binärt
    bank: F 1.5-1.8
    maskin: F fas 6
    felfall: S tjänsten startar om sig själv; stoppvakten släpper vid krasch
    agare: S cnc pi/
    aterstallning: S systemd startar om; microSD skrivs om utifrån genom springan
  Programvara på datorn:
    krav: S cnc docs
    konstruktion: S armsparr, probval, matsekvens
    auto: A cnc testsviten (4 fel fanns före 2026-11-11, ej i dessa delar)
    berakning: X ingen beräkning behövs; beteendet är binärt
    bank: X kan bara provas på maskinen
    maskin: F fas 6-7
    felfall: A cnc test_pistopp.py (stopp begärs och bekräftas, annars fel)
    agare: S cnc
    aterstallning: S ny körning; svarta lådan i cnc
  Nätverk:
    krav: S ingen säkerhet över Wi-Fi
    konstruktion: S HTTP på port 8080
    auto: X går inte att kontrollera automatiskt; prövas fysiskt
    berakning: X ingen beräkning behövs; beteendet är binärt
    bank: F 1.5
    maskin: N Wi-Fi-räckvidd i garaget
    felfall: S bortfall ger fel i armspärren (stopp); stopp går ändå via knapp och pump
    agare: S cnc pi/README.md
    aterstallning: N Pi:n återansluter till Wi-Fi
  Kabelföring genom rörelsen:
    krav: S CABLE_ROUTING.md
    konstruktion: S MONTAGE.md, kabelväg ut ur tornet
    auto: X går inte att kontrollera automatiskt; prövas fysiskt
    berakning: S längd = X-motorkabelns + 0,3 m, böjradie 10 x diameter
    bank: X kan bara provas på maskinen
    maskin: F 5.3
    felfall: N avbruten ledare i pumpkedjan stoppar; avbruten probledare ger ingen kontakt (larm vid G38)
    agare: S CABLE_ROUTING.md
    aterstallning: N byt kabel; lödd i tornet
  Värme i tornet:
    krav: S MONTAGE.md, miljökrav
    konstruktion: S PETG, slitsar
    auto: X går inte att kontrollera automatiskt; prövas fysiskt
    berakning: A berakning_sidotorn.py
    bank: F 1.5 (vcgencmd)
    maskin: F 6.9 långkörning
    felfall: N Pi:n stryper sig själv
    agare: S MONTAGE.md
    aterstallning: N vänta tills svalt; strypning återgår av sig själv
  Damm och spån:
    krav: S MONTAGE.md, miljökrav
    konstruktion: S dammnät på mikrofonen
    auto: X går inte att kontrollera automatiskt; prövas fysiskt
    berakning: X ingen beräkning behövs; beteendet är binärt
    bank: X kan bara provas på maskinen
    maskin: F 8.0 dammprov
    felfall: S smutsig lins ger stopp via armspärren
    agare: S MONTAGE.md
    aterstallning: S rengör lins, mikrofonnät och stift
  Underhåll:
    krav: N
    konstruktion: S SD utifrån, panel med sex skruvar
    auto: A kontroll_montage.py
    berakning: X ingen beräkning behövs; beteendet är binärt
    bank: X kan bara provas på maskinen
    maskin: N
    felfall: X inget felfall utöver de i andra rader
    agare: S MONTAGE.md
    aterstallning: X inget att återställa
  230 V-säkerhet:
    krav: S D024, AUDIT.md
    konstruktion: S layout i EL_BELYSNING_OCH_STOPP.md
    auto: X går inte att kontrollera automatiskt; prövas fysiskt
    berakning: X säkringar och kontaktor väljs efter märkström och motorlastklass; ingen egen beräkning
    bank: X kan bara provas på maskinen
    maskin: F kopplas av någon van vid nätspänning
    felfall: S felfallstabell i EL_BELYSNING_OCH_STOPP.md
    agare: S machine/EL_BELYSNING_OCH_STOPP.md
    aterstallning: S koppla bort stickproppen före öppning
  Dokumentens samstämmighet:
    krav: S CLAUDE.md (en källa per sak)
    konstruktion: X gäller dokument, inte konstruktion
    auto: A kontroll_dokument.py (BOM har varje fästelement i MONTAGE.md)
    berakning: X ingen beräkning behövs; beteendet är binärt
    bank: X kan bara provas på maskinen
    maskin: X gäller dokument, inte maskinen
    felfall: N fel skruvar köps eller tas fram
    agare: S BOM.md
    aterstallning: A kontroll_dokument.py visar vad som ska rättas

  Probstiftet mot fräsens spets:
    krav: S stiftet under längsta verktyget vid mätning; inget parkerat under kjolen (beslut 0007-frågan)
    konstruktion: S CR Touch utfällt 63,6 mm under kjolen
    auto: A berakning_sidotorn.py
    berakning: A berakning_sidotorn.py; N längsta verktygets utstick antaget 30 mm
    bank: X kan bara provas på maskinen
    maskin: F 7.1 och 7.2
    felfall: S fräsen tar i först om ett mycket långt verktyg sitter i; mat_z sänker Z bara med stiftet ute
    agare: S machine/probstyrning/README.md
    aterstallning: S kortare verktyg eller längre stift; mät utstick
  Kamerafäste och optisk stabilitet:
    krav: S kameran får inte röra sig mot tornet mellan kalibreringar
    konstruktion: S tappar i kortets hål, två M3 klämmer kanten
    auto: A kontroll_montage.py steg 5
    berakning: N vibrationens inverkan på bilden ej räknad; stillbild tas när maskinen står still
    bank: F 1.6
    maskin: F 7.3 och omkalibrering efter fas 8
    felfall: S kalibreringens kontrollpunkter visar avvikelse (cnc kameraseende)
    agare: S machine/KAMERA_ANHALL.md
    aterstallning: S dra åt klämmorna, kalibrera om

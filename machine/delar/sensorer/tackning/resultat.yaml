# Utförda prov och kontroller med bevis. En ruta räknas som VERIFIERAD först när den har en post här
# med utfall godkänd. En kodlänk eller ett planerat prov är inte bevis (granskning från Codex 2026-11-11).
# Format per post:
#   - matris: komponenter | system
#     rad: <radnamn exakt som i matrisen>
#     kolumn: <kolumnnyckel, t.ex. funktion>
#     datum: ÅÅÅÅ-MM-DD
#     metod: vad som gjordes
#     protokoll: var resultatet står (CALIBRATION.md-avsnitt, fil, foto)
#     ansvarig: vem som gjorde provet
#     utfall: godkänd | underkänd
poster:
  - matris: komponenter
    rad: Servohorn
    kolumn: fastsattning
    datum: 2026-11-11
    metod: hornprovet i PLA (sensorprov-pla), hornet i fickan med bygel och M3, servot under
    protokoll: CALIBRATION.md, 2026-11-11 hornprov 1
    ansvarig: användaren
    utfall: underkänd
  - matris: komponenter
    rad: Skyddshylsa
    kolumn: insattning
    datum: 2026-11-11
    metod: CR Touch-provet i PLA (sensorprov-pla); CR Touchen gick inte att få in i hylsan
    protokoll: CALIBRATION.md, 2026-11-11 CR Touch-prov 1
    ansvarig: användaren
    utfall: underkänd
  - matris: komponenter
    rad: Camera Module 3
    kolumn: insattning
    datum: 2026-11-11
    metod: kamerafickan i PLA (sensorprov-pla) med användarens Camera Module 3; kortet in i fickan på tapparna
    protokoll: CALIBRATION.md, 2026-11-11 Kameraprov 1
    ansvarig: användaren
    utfall: godkänd
  - matris: komponenter
    rad: Servohorn
    kolumn: fastsattning
    datum: 2026-11-12
    metod: sensorprov-2 (PETG): hornet i armens formficka, arm + horn på servot med M3 x 10 genom armen
    protokoll: CALIBRATION.md, 2026-11-12 sensorprov-2 delprov 1
    ansvarig: användaren
    utfall: godkänd
  - matris: komponenter
    rad: Arm
    kolumn: fastsattning
    datum: 2026-11-12
    metod: sensorprov-2 (PETG): armen monterad på servot med M3 x 10
    protokoll: CALIBRATION.md, 2026-11-12 sensorprov-2 delprov 1
    ansvarig: användaren
    utfall: godkänd
  - matris: komponenter
    rad: CR Touch
    kolumn: fastsattning
    datum: 2026-11-12
    metod: sensorprov-2 (PETG): CR Touchen med kitets två M3 x 6 underifrån i armfoten

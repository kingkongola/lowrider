# Täckningsmatris per komponent. Källa till sanning för VAD som är kontrollerat och hur.
# Status per ruta (först i texten): A = automatisk kontroll (skript), S = simulerad/beräknad,
# F = fysiskt prov (steg i CHECKLIST.md), N = nominellt antagande, ej verifierat,
# X = ej relevant (med skäl), SAKNAS = inte kontrollerat. Ingen ruta får vara tom.
# Uppdatera rutan när en kontroll läggs till eller ett prov rapporteras. Kör tackning.py.
kolumner:
  matt: Mått verifierade
  tillverkning: Print/tillverkning
  insattning: Insättning, fri väg
  fastsattning: Fastsättning, åtkomst och grepp
  koppling: Elektrisk koppling och kabelväg
  rorelse: Frigång i drift
  last: Last och vibration
  varme: Värme
  damm: Damm och spån
  service: Service och byte
  funktion: Funktionsprov

komponenter:

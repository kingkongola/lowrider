# Täckningsmatris per komponent. Källa till sanning för VAD som är kontrollerat och hur.
# Status per ruta (först i texten): A = automatisk kontroll (skript), S = simulerad/beräknad,
# F = fysiskt prov (steg i CHECKLIST.md), N = nominellt antagande, ej verifierat,
# X = ej relevant (med skäl), SAKNAS = inte kontrollerat. Ingen ruta får vara tom.
# Uppdatera rutan när en kontroll läggs till eller ett prov rapporteras. Kör tackning.py.
kolumner:
  matt: Mått verifierade
  tillverkning: Print/tillverkning
  insattning: Insättning, fri väg
  fastsattning: Fastsättning, åtkomst och grepp
  koppling: Elektrisk koppling och kabelväg
  rorelse: Frigång i drift
  last: Last och vibration
  varme: Värme
  damm: Damm och spån
  service: Service och byte
  funktion: Funktionsprov

komponenter:
  Torn:
    matt: A sidotorn.py, kontroll_omgivning.py (mot skanning)
    tillverkning: S printjobb sidotorn-torn, 5,6 h, stöd 7 %; F provprint i PLA före PETG
    insattning: X basdel
    fastsattning: A kontroll_montage.py steg 4 (båda M5); F 5.2
    koppling: X
    rorelse: A kontroll_omgivning.py (Core, fästen, dammsko, kjol, skanning)
    last: SAKNAS styvhet och egenfrekvens för torn och ADXL-platta ej beräknade; knackprov saknas i checklistan
    varme: SAKNAS temperatur i slutet rum med Pi och två LM2596 ej beräknad eller mätt
    damm: SAKNAS öppningar (SD-springa, kabelutgång, panelslitsar) ej bedömda mot spån
    service: S MONTAGE.md; kameran kräver att tornet tas av
    funktion: F fas 4 och 5
  Sidopanel:

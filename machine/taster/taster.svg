 x1="440" y1="930" x2="500" y2="930" stroke="#222" stroke-width="2"/><line x1="540" y1="930" x2="620" y2="930" stroke="#222" stroke-width="2"/><line x1="660" y1="930" x2="720" y2="930" stroke="#222" stroke-width="2"/><text x="80" y="936" font-size="16" text-anchor="middle" fill="#222" font-family="Helvetica" >in</text><text x="180" y="936" font-size="16" text-anchor="middle" fill="#222" font-family="Helvetica" >kula</text><text x="300" y="936" font-size="16" text-anchor="middle" fill="#222" font-family="Helvetica" >stift 1</text><text x="420" y="936" font-size="16" text-anchor="middle" fill="#222" font-family="Helvetica" >kula</text><text x="520" y="936" font-size="16" text-anchor="middle" fill="#222" font-family="Helvetica" >kula</text><text x="640" y="936" font-size="16" text-anchor="middle" fill="#222" font-family="Helvetica" >stift 2</text><text x="740" y="936" font-size="16" text-anchor="middle" fill="#222" font-family="Helvetica" >…</text><text x="800" y="900" font-size="18" text-anchor="start" fill="#222" font-family="Helvetica" >Rör spetsen något → ett stift lyfts från en kula → kretsen bryts → maskinen stannar.</text><text x="800" y="930" font-size="18" text-anchor="start" fill="#c0392b" font-family="Helvetica" >Navet MÅSTE vara i plast: i metall kortsluts stiften och en lyft märks inte.</text><text x="800" y="960" font-size="18" text-anchor="start" fill="#c0392b" font-family="Helvetica" >Starta ALDRIG KATSU med tastern i chucken (sladden).</text></svg>
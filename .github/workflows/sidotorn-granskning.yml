name: Sidotorn granskningsmatriser
on:
  push:
    paths:
      - 'machine/delar/sensorer/granskning/**'
      - 'machine/delar/sensorer/sidotorn.py'
      - '.github/workflows/sidotorn-granskning.yml'
  pull_request:
    paths:
      - 'machine/delar/sensorer/granskning/**'
      - 'machine/delar/sensorer/sidotorn.py'
      - '.github/workflows/sidotorn-granskning.yml'
jobs:
  matriser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera komplett matris och CAD-exportlista (inte driftgodkännande)
        run: python3 machine/delar/sensorer/granskning/kontrollera_matriser.py

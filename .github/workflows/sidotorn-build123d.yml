name: Sidotorn (build123d CAD-kontroller)

# Bygger sidotornet och kör de exakta CAD-kontrollerna. Varje kontroll avbryter med fel
# om något krockar, så en ändring som förstör passningen stoppas här och inte vid montaget.
# Grön körning betyder att CAD:en hänger ihop, inte att delarna är provade fysiskt.

on:
  push:
    paths:
      - 'machine/delar/sensorer/sidotorn.py'
      - 'machine/delar/sensorer/crtouch.py'
      - 'machine/delar/sensorer/hornfaste.py'
      - 'machine/delar/sensorer/lampor.py'
      - 'machine/delar/sensorer/passningsprov.py'
      - 'machine/delar/sensorer/kontroll_*.py'
      - 'machine/delar/sensorer/referenser/**'
      - '.github/workflows/sidotorn-build123d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera samma CAD-motor som lokalt
        run: python -m pip install 'build123d==0.13.0' 'cadquery-ocp-novtk==8.0.1.1.0' 'ocp_gordon==0.3.1'
      - name: Bygg torn, arm, panel och STEP
        run: python machine/delar/sensorer/sidotorn.py --ut export/sidotorn
      - name: Mikrofonens kort, lödning, ledningsväg och ljudhål
        working-directory: machine/delar/sensorer
        run: python kontroll_mikrofon.py
      - name: Pi-stiftlistens lödplats per stift och ledningsgator
        working-directory: machine/delar/sensorer
        run: python kontroll_stiftlist.py
      - name: CR Touch-fot, hylsa och rörelse
        run: python machine/delar/sensorer/kontroll_crtouch.py --ut export/kontroll-crtouch
      - name: Hornfickans klämväg, skruvar och rörelse
        run: python machine/delar/sensorer/kontroll_horn.py --ut export/kontroll-horn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidotorn-cad
          path: export/
          retention-days: 30
